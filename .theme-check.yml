extends: theme-check:recommended
ignore:
  - node_modules/**
  - scripts/**
  - tests/**

# Horizon 4.4.0 uses a filter that Theme Check doesn't know yet. Both files are
# unmodified Horizon code.
UnknownFilter:
  ignore:
    - blocks/disclosures.liquid
    - snippets/cart-disclosure-tooltip.liquid

# The store runs in English, and Shopify falls back to the default locale for
# missing keys. New keys are translated when a language is actually published.
MatchingTranslations:
  enabled: false
